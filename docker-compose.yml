services:
  postgres:
    image: postgres:16-alpine
    container_name: alpha_postgres
    restart: always
    environment:
      POSTGRES_USER: alpha_user
      POSTGRES_PASSWORD: alpha_password
      POSTGRES_DB: alpha_market_data
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: alpha_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
